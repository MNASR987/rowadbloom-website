# صفحة عن المدرسة
seo:
  title: "عن المدرسة"
  description: "عن مدارس رواد بلوم العالمية بالرياض، إحدى مدارس أكاديمية رواد الشروق: كلمة الترحيب، القيادة، البرامج، مركز الاختبارات البريطانية والترخيص."

hero:
  title: "عن رواد بلوم"
  text: "مدارس عالمية في الرياض للبنين والبنات، من الروضة إلى الصف الثاني عشر."

welcome:
  title: "أهلًا بكم في رواد بلوم"
  body: |
    أهلًا بكم في مدارس رواد بلوم العالمية.

    نحن مجتمع مدرسي في الرياض يضم قسمًا كبيرًا لرياض الأطفال ومدرسة للبنات ومدرسة للبنين، ونستقبل المتعلمين من الروضة الأولى إلى الصف الثاني عشر. يدرس طلابنا وفق برامج أمريكية وبريطانية، ومدرستنا مركز معتمد لاختبارات بيرسون إدكسل وكامبريدج وأكسفورد AQA.

    نريد لطلابنا أن يشعروا بالثقة في بيئة عالمية وأن يعتزوا بهويتهم. ولذلك تأتي اللغة العربية والقرآن الكريم والدراسات الإسلامية في قلب كل أسبوع دراسي، إلى جانب اللغة الإنجليزية والرياضيات والعلوم.

    ولا ينجح شيء من ذلك من دون أولياء الأمور. بابنا مفتوح، ونفضّل دائمًا أن نسمع أي ملاحظة مبكرًا لا متأخرًا.

    نتطلع إلى لقائكم عند زيارتكم للمدرسة.
  name: "الأستاذة بشرى الشهراني"
  role: "مديرة المدرسة"

