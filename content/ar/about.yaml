values:
  title: "ما نؤمن به"
  items:
    - title: "شخصية متجذّرة في الإيمان"
      text: "التعليم لا يبني العقول فقط بل يبني الشخصية، مسترشدًا بالمبادئ الإسلامية والاحترام والأمانة."
    - title: "هوية سعودية ونظرة عالمية"
      text: "ينشأ الطلاب معتزّين بتراثهم وثقافتهم، وواثقين في تعاملهم مع العالم."
    - title: "قدرات كل طالب"
      text: "التعلّم يجب أن يكون مشوّقًا وقريبًا من كل طالب، ليكتشف نقاط قوته ويعبّر عن رأيه."
    - title: "التفكير الناقد"
      text: "نوجّه الطلاب إلى أن يسألوا ويحللوا ويستدلوا، لا أن يحفظوا المعلومات فقط."
    - title: "التقنية والابتكار"
      text: "الثقافة الرقمية وحل المشكلات بطرق إبداعية يهيئان الطلاب لعالم متغيّر."
    - title: "المجتمع والشراكة"
      text: "الأسرة والمعلمون والمجتمع يتشاركون مسؤولية بناء عقول الناشئة."

