sections:
  - id: wellbeing
    title: "رعاية الطلاب"
    text: |
      يتعلم الأطفال أفضل حين يشعرون بالأمان والاهتمام والتقدير. معلمونا يعرفون كل طفل جيدًا: نقاط قوته، وما يقلقه، وما يساعده على النمو.

      لكل فصل معلم فصل هو أول من يتواصل معه الطلاب وأولياء الأمور. توقعاتنا واضحة ومستمدة من القيم الإسلامية: الاحترام واللطف والصدق والمسؤولية. لا نقبل التنمر بأي شكل، ونستمع لكل ملاحظة ونتابعها.

      نعمل عن قرب مع الأُسر. إذا كان هناك ما يقلق طفلكم، أخبرونا مبكرًا، ومعًا نستطيع مساعدته.
    list:
      - "معلم فصل يعرف كل طفل"
      - "توقعات سلوكية واضحة مستمدة من القيم الإسلامية"
      - "لا تسامح مع التنمر"
      - "تواصل منتظم مع أولياء الأمور، منه لقاءان مع المعلمين كل عام"
  - id: activities
    title: "الأنشطة والأندية"
    text: |
      التعلّم في رواد بلوم لا يقف عند الجدول الدراسي. الأنشطة والأندية تساعد الطلاب على اكتشاف اهتمامات جديدة وتكوين صداقات وتنمية القيادة والعمل الجماعي.

      وعلى مدار العام تجتمع المدرسة كلها للاحتفال بالمناسبات الوطنية مثل اليوم الوطني السعودي ويوم التأسيس.
    list:
      - "تلاوة القرآن الكريم"
      - "البرمجة"
      - "القراءة والخطابة"
      - "تحديات العلوم و STEM"
      - "الفن والإبداع"
      - "الرياضة والنشاط البدني"
  - id: health
    title: "الصحة والسلامة"
    text: |
      تعتني العيادة المدرسية بالطلاب خلال اليوم الدراسي، من الإصابات البسيطة إلى حالات التوعك. ونتواصل مع ولي الأمر فورًا متى احتاج الطفل إلى العودة إلى المنزل أو إلى رعاية طبية.

      لا يُعطى أي دواء في المدرسة إلا بموافقة خطية من ولي الأمر. يُرجى إخبارنا بأي حساسية أو حالة صحية عند التحاق طفلكم، وعند حدوث أي تغيير.

      الطلاب تحت الإشراف في كل الأوقات، ومنها وقت الحضور والانصراف، والدخول إلى المدرسة منظّم فلا يدخلها إلا الزوار المصرّح لهم.
    list:
      - "عيادة مدرسية خلال اليوم الدراسي"
      - "لا دواء إلا بموافقة خطية من ولي الأمر"
      - "إشراف على الحضور والانصراف"
      - "دخول منظّم للزوار"
