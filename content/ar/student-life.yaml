# صفحة الحياة المدرسية
seo:
  title: "الحياة المدرسية"
  description: "الحياة المدرسية في مدارس رواد بلوم العالمية بالرياض: رعاية الطلاب، الأنشطة والأندية، والصحة والسلامة مع العيادة المدرسية."

hero:
  title: "الحياة المدرسية"
