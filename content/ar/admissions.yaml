faq:
  title: "الأسئلة الشائعة"
  items:
    - q: "ما الصفوف المتاحة لديكم؟"
      a: "رياض الأطفال (من روضة 1 إلى روضة 3) والصفوف من الأول إلى الثاني عشر، للبنين والبنات."
    - q: "ما المنهج الذي تتبعونه؟"
      a: "برامج أمريكية وبريطانية، إلى جانب اللغة العربية والقرآن الكريم والدراسات الإسلامية والدراسات الاجتماعية."
    - q: "هل لديكم قسم بريطاني؟"
      a: "نعم. في المرحلتين المتوسطة والثانوية يمكن للأسر الاختيار بين البرنامج الأمريكي والقسم البريطاني، للبنين والبنات. والقسم البريطاني يؤهّل للاختبارات الدولية."
    - q: "هل يمكن لطلاب من خارج المدرسة أداء الاختبارات في مركزكم؟"
      a: "نعم. رواد بلوم مركز معتمد لاختبارات بيرسون إدكسل وكامبريدج وأكسفورد AQA، متاح لطلابنا وللمتقدمين من خارج المدرسة. يُرجى التواصل مع المدرسة لمعرفة طريقة التسجيل والمواعيد."
    - q: "هل تدرّسون اللغة العربية والدراسات الإسلامية؟"
      a: "نعم. اللغة العربية والقرآن الكريم والدراسات الإسلامية والدراسات الاجتماعية تُدرَّس ضمن مواد الهوية."
    - q: "ما الرسوم الدراسية؟"
      a: "يُرجى التواصل مع فريق القبول لمعرفة الرسوم الدراسية الحالية ومواعيد السداد."
    - q: "من يدير المدرسة؟"
      a: "مدارس رواد بلوم العالمية إحدى مدارس أكاديمية رواد الشروق."
    - q: "هل توفرون نقلًا مدرسيًا؟"
      a: "يُرجى التواصل مع فريق القبول للسؤال عن النقل المدرسي في منطقتكم."
    - q: "متى يمكن لطفلي أن يبدأ؟"
      a: "تواصلوا مع فريق القبول للتأكد من توفر مقعد في صف طفلكم، ويسعدنا المساعدة في الالتحاق خلال العام متى توفرت المقاعد."

enquire:
  title: "استفسر أو احجز جولة"
  text: "شاركونا بعض البيانات وسيتواصل معكم فريق القبول."
