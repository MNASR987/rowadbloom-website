# صفحة القبول والتسجيل
seo:
  title: "القبول والتسجيل"
  description: "القبول في مدارس رواد بلوم العالمية بالرياض: من نقبل، خطوات القبول، المستندات المطلوبة، الأسئلة الشائعة، الاستفسارات وجولات المدرسة."

hero:
  title: "القبول والتسجيل"
  text: "نتطلع إلى استقبال أسرتكم. هنا كل ما تحتاجونه للبدء."

whoWeAdmit:
  title: "من نقبل"
  groups:
    - { title: "رياض الأطفال", text: "من روضة 1 إلى روضة 3، بنين وبنات" }
    - { title: "مدرسة البنات ومدرسة البنين", text: "من الصف الأول إلى الصف الثاني عشر" }
  note: "نرحب بالأسر من جميع الجنسيات. شروط السن لكل صف تتبع أنظمة وزارة التعليم، وسيؤكد لكم فريق القبول الصف المناسب لطفلكم."

process:
  title: "خطوات القبول"
  note: "ست خطوات بسيطة من أول سؤال إلى أول يوم دراسي لطفلكم."
  steps:
    - { title: "الاستفسار", text: "أرسلوا استفساركم عبر الموقع أو واتساب أو الهاتف." }
    - { title: "الزيارة", text: "احجزوا جولة في المدرسة والتقوا بفريق القبول." }
    - { title: "التقديم", text: "أكملوا طلب الالتحاق وقدّموا المستندات المطلوبة." }
    - { title: "تحديد المستوى", text: "يلتقي طفلكم بفريقنا في اختبار ودّي لتحديد المستوى، لنتعرف على مستواه وندعمه من اليوم الأول." }
    - { title: "القرار", text: "نتواصل معكم بقرار القبول والخطوات التالية." }
    - { title: "التسجيل", text: "أكّدوا المقعد بإتمام التسجيل وسداد الرسوم. بعدها نرحب بطفلكم ونزوّدكم بكل ما تحتاجونه لليوم الأول." }

documents:
  title: "المستندات المطلوبة"
  note: "يُرجى إحضار صور من المستندات التالية. وسيخبركم فريق القبول إن كان هناك مستند آخر مطلوب لصف طفلكم."
  items:
    - "شهادة ميلاد الطالب"
    - "جواز سفر الطالب والإقامة، أو الهوية الوطنية (للطلاب السعوديين)"
    - "هوية ولي الأمر أو إقامته"
    - "آخر تقرير دراسي وشهادة الانتقال (من الصف الأول فما فوق)"
    - "سجل التطعيمات"
    - "صور شخصية حديثة بمقاس جواز السفر"

