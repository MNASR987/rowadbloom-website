  description: "مدارس رواد بلوم العالمية في الرياض، المملكة العربية السعودية: برامج أمريكية وبريطانية من الروضة إلى الصف الثاني عشر، مدرسة للبنات ومدرسة للبنين، ومركز معتمد للاختبارات البريطانية."

