# صفحة الوظائف
seo:
  title: "الوظائف"
  description: "الوظائف في مدارس رواد بلوم العالمية بالرياض: انضم إلى فريقنا التعليمي."

hero:
  title: "الوظائف في رواد بلوم"
  text: "انضم إلى فريق يبني متعلمين واثقين ومتمكنين في الرياض."

why:
  title: "لماذا تعمل معنا"
  text: "في رواد بلوم ستدرّس ضمن برامج أمريكية وبريطانية، من الروضة إلى الصف الثاني عشر. نقدّر المعلمين الذين يهتمون بكل طفل، ويواصلون التعلّم، ويعملون بروح الفريق. وبصفتنا إحدى مدارس أكاديمية رواد الشروق، نوفّر بيئة داعمة وفرصًا للنمو."

vacancies:
  title: "الوظائف المتاحة"
  empty: "لا توجد وظائف معلنة حاليًا. يسعدنا استقبال سيرتكم الذاتية للفرص المستقبلية."
  items: []

apply:
  title: "طريقة التقديم"
  text: "أرسل سيرتك الذاتية وخطاب التقديم بالبريد الإلكتروني، مع ذكر الوظيفة التي تتقدم لها."
  missing: "[TO CONFIRM: Recruitment email address]"

safer:
  title: "التوظيف الآمن"
  text: "مدارس رواد بلوم العالمية ملتزمة بحماية الأطفال. جميع التعيينات مشروطة بالتحقق من الهوية والمؤهلات والتوصيات، وبالفحوصات التي تتطلبها الأنظمة السعودية."
