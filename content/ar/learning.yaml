# صفحة التعلّم
seo:
  title: "التعلّم"
  description: "التعلّم في مدارس رواد بلوم العالمية بالرياض: رياض الأطفال والابتدائية والمتوسطة والثانوية، برامج أمريكية وبريطانية، مواد الهوية، اللغات ومركز الاختبارات البريطانية."

hero:
  title: "التعلّم في رواد بلوم"
  text: "رحلة متصلة من الروضة إلى الصف الثاني عشر: برامج أمريكية وبريطانية، مع أساس متين في اللغة العربية والتربية الإسلامية والهوية الوطنية."

journey:
  title: "رحلة المتعلم"
  intro: "أربع مراحل في رحلة واحدة متصلة، كل مرحلة تبني على ما قبلها."
  phases:
    - name: "رياض الأطفال"
      grades: "روضة 1 – روضة 3"
      who: "بنين وبنات"
      text: "يتعلم الأطفال باللعب والقصص والأناشيد والاكتشاف العملي. يكتسبون مهارات القراءة والكتابة والأعداد الأولى باللغتين الإنجليزية والعربية، ويحفظون قصار السور ويتعلمون الآداب الإسلامية، وتزداد ثقتهم بأنفسهم، ليبدأوا الصف الأول بفضول واستعداد للتعلّم."
    - name: "المرحلة الابتدائية"
      grades: "الصفوف 1 – 6"
      who: "بنين وبنات"
      text: "أساس متين في اللغة الإنجليزية والرياضيات والعلوم والدراسات الاجتماعية، إلى جانب اللغة العربية والقرآن الكريم والدراسات الإسلامية. يتعلم الطلاب أن يقرأوا كثيرًا ويكتبوا بوضوح ويفكروا بأنفسهم."
    - name: "المرحلة المتوسطة"
      grades: "الصفوف 7 – 9"
      who: "مدرسة البنات · مدرسة البنين"
      text: "يتحمل الطلاب مسؤولية أكبر عن تعلّمهم. تتعمق المواد، ويتدرب الطلاب على البحث والعرض والدراسة المستقلة. ويمكن للأسر الاختيار بين البرنامج الأمريكي والقسم البريطاني."
    - name: "المرحلة الثانوية"
      grades: "الصفوف 10 – 12"
      who: "مدرسة البنات · مدرسة البنين"
      text: "دراسة جادّة في المواد الأساسية تهيئ الطلاب للجامعة ولمستقبلهم المهني، مع إرشاد في اختيار المواد والخطوات التالية. ويمكن للأسر الاختيار بين البرنامج الأمريكي والقسم البريطاني، ويؤدي طلاب القسم البريطاني الاختبارات الدولية في مركزنا المعتمد."

curriculum:
  title: "منهجنا"
  text: |
    تقدّم مدارس رواد بلوم العالمية برامج أمريكية وبريطانية مرخّصة من وزارة التعليم. المواد الأساسية هي اللغة الإنجليزية والرياضيات والعلوم، ويدرس كل طالب كذلك مواد الهوية: اللغة العربية، والقرآن الكريم والدراسات الإسلامية، والدراسات الاجتماعية.

    في المرحلتين المتوسطة والثانوية يمكن للأسر الاختيار بين البرنامج الأمريكي والقسم البريطاني. والقسم البريطاني، للبنين والبنات، يؤهّل للاختبارات الدولية.

    الدروس نشطة وعملية. يسأل الطلاب ويناقشون ويبحثون ويطبقون ما يتعلمونه، لأننا نؤمن بأن التفكير الناقد أهم من حفظ المعلومات.

identity:
  title: "مواد الهوية"
  intro: "ينشأ كل متعلم في رواد بلوم على انتماء قوي لدينه ولغته ووطنه."
  items:
    - title: "اللغة العربية"
      text: "يكتسب الطلاب مهارات قوية في القراءة والكتابة والتحدث والاستماع باللغة العربية، وينشأون على حب لغة القرآن ولغة تراثهم."
    - title: "القرآن الكريم والدراسات الإسلامية"
      text: "يتعلم الطلاب تلاوة القرآن الكريم وحفظه وفهم معانيه، مسترشدين بالمبادئ الإسلامية من احترام وصدق وأمانة."
    - title: "الدراسات الاجتماعية"
      text: "يتعرف الطلاب على تاريخ المملكة العربية السعودية وجغرافيتها وثقافتها، وعلى معنى المواطنة المسؤولة في عالم متغيّر."

languages:
  title: "اللغات"
  text: |
    اللغة الإنجليزية هي لغة التدريس في مواد البرامج العالمية، فيصبح الطلاب واثقين في القراءة والكتابة والتحدث بها.

    تُدرَّس اللغة العربية مادةً أساسية لكل طالب، ويُدرَّس القرآن الكريم والدراسات الإسلامية باللغة العربية. ويتعلم الطلاب كذلك الفرنسية أو الألمانية لغةً إضافية.

stem:
  title: "القسم البريطاني ومركز الاختبارات"
  text: "في رواد بلوم قسم بريطاني لطلاب المرحلتين المتوسطة والثانوية، بنين وبنات، والمدرسة مركز معتمد للاختبارات الدولية. المركز متاح لطلابنا وللمتقدمين من خارج المدرسة."
  points:
    - "بيرسون إدكسل (Pearson Edexcel)"
    - "كامبريدج (Cambridge)"
    - "أكسفورد AQA (OxfordAQA)"
  more: "لمعرفة طريقة التسجيل في الاختبارات ومواعيدها ورسومها، يُرجى التواصل مع المدرسة."

assessment:
  title: "أسلوبنا في التقويم"
  text: |
    يتحقق المعلمون من الفهم كل يوم داخل الفصل، بالأسئلة والأعمال الصفية والتغذية الراجعة، حتى لا يتأخر أي طالب.

    في كل فصل دراسي دورتان من الاختبارات القصيرة، يليهما أسبوع مراجعة ثم اختبارات نهاية الفصل. ويلتقي أولياء الأمور بالمعلمين في لقاءين كل عام، وتواريخ كل التقويمات موجودة في التقويم الدراسي.
