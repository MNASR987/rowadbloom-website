faq:
  title: "Frequently Asked Questions"
  items:
    - q: "Which grades do you offer?"
      a: "Kindergarten (KG1 to KG3) and Grades 1 to 12, for boys and girls."
    - q: "Which curriculum do you follow?"
      a: "American and British programmes, alongside Arabic, Holy Quran and Islamic Studies, and Social Studies."
    - q: "Do you have a British section?"
      a: "Yes. In Middle School and High School, families can choose between the American programme and the British section, for boys and girls. The British section leads to international examinations."
    - q: "Can external students sit examinations at your centre?"
      a: "Yes. Rowad Bloom is an approved centre for Pearson Edexcel, Cambridge and OxfordAQA examinations, open to our own students and to external candidates. Please contact the school for entries and dates."
    - q: "Do you teach Arabic and Islamic Studies?"
      a: "Yes. Arabic, Holy Quran and Islamic Studies, and Social Studies are taught as identity subjects."
    - q: "What are the tuition fees?"
      a: "Please contact our admissions team for the current tuition fees and payment schedule."
    - q: "Who runs the school?"
      a: "Rowad Bloom International Schools is one of the schools of El-Shrouk Pioneer Academy."
    - q: "Do you provide school transport?"
      a: "Please contact our admissions team to ask about school transport for your area."
    - q: "When can my child start?"
      a: "Contact our admissions team to check availability in your child's grade — we will be happy to help with joining during the year where places allow."

enquire:
  title: "Enquire or Book a Tour"
  text: "Share a few details and our admissions team will contact you."
