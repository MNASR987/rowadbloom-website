fees:
  title: "Tuition Fees 2026–2027"
  intro: "Annual tuition fees in Saudi riyals (SAR), for boys and girls from KG1 to Grade 12."
  columnStage: "Grade"
  columnBefore: "Before discount"
  columnFee: "After discount (SAR)"
  rows:
    - { stage: "KG1 – KG3", before: "12,000", fee: "11,000" }
    - { stage: "Grade 1 – Grade 3", before: "13,000", fee: "12,000" }
    - { stage: "Grade 4 – Grade 6", before: "14,000", fee: "13,000" }
    - { stage: "Grade 7 – Grade 9", before: "14,500", fee: "13,500" }
    - { stage: "Grade 10 – Grade 12", before: "15,500", fee: "14,500" }
  notes:
    - "**Early registration offer:** an extra SAR 500 off for the first 100 students."
