# ABOUT PAGE
seo:
  title: "About Us"
  description: "About Rowad Bloom International Schools, Riyadh, one of the schools of El-Shrouk Pioneer Academy: welcome, leadership, programmes, the British examinations centre and licensing."

hero:
  title: "About Rowad Bloom"
  text: "International schools in Riyadh for boys and girls, from Kindergarten to Grade 12."

welcome:
  title: "Welcome to Rowad Bloom"
  body: |
    Welcome to Rowad Bloom International Schools.

    We are a community of schools in Riyadh: a large Kindergarten section, a Girls School and a Boys School, taking learners from KG1 to Grade 12. Our students follow American and British programmes, and our school is an approved centre for Pearson Edexcel, Cambridge and OxfordAQA examinations.

    We want our students to be at ease in an international setting and proud of who they are. That is why Arabic, the Holy Quran and Islamic Studies sit at the centre of every week, alongside English, mathematics and science.

    None of this works without parents. Our door is open, and we would always rather hear a concern early than late.

    We look forward to meeting you when you visit our campus.
  name: "Ms. Bushra Al-Shahrani"
  role: "Principal"

