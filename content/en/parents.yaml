seo:
  title: "Parents"
  description: "Information for parents at Rowad Bloom International Schools, Riyadh: academic calendar 2026–2027, school uniform, key policies and the parent portal."

hero:
  title: "Parents"
  text: "Everything you need for the school year, in one place."

portal:
  title: "Parent Portal"
  text: "Log in to follow your child's learning, reports and school announcements."
  button: "Go to the Parent Portal"
  missing: "[TO CONFIRM: Parent portal link]"

# School uniform: add the wording below to show the uniform section.
uniform:
  title: "School Uniform"
  text: "Our uniform is lime green and navy, with the Rowad Bloom crest. The basic uniform is included in the tuition fees. For sizes and extra pieces, please contact the school office."
  # Photos are in brand/uniform — one caption per photo, in file-name order
  photos:
    - "The Rowad Bloom uniform"
    - "Long-sleeve polo and navy skirt"
    - "Short-sleeve polo and navy shorts"
    - "Winter hoodie and navy trousers"
    - "Tracksuit with green T-shirt"

partnership:
  title: "Working together"
  items:
    - title: "Parent–teacher conferences"
      text: "Two conferences each year to talk with teachers about your child's progress."
    - title: "Quizzes and exams"
      text: "Two quiz cycles in each semester, then a revision week and semester exams. Dates are in the calendar above."
    - title: "Speak to us early"
      text: "Our door is open. If something is worrying you or your child, contact the class teacher or the school office — we would always rather hear a concern early than late."

